[build-system]
requires = ["uv_build>=0.10"]
build-backend = "uv_build"

[project]
description = "`cookiecutter` package with a Python DS project template that you can use to create new DS projects"
license = {file = "LICENSE"}
name = "python-project-template"
readme = "README.md"
requires-python = ">=3.13"
version = "0.0.1"
authors = [{name = "Dinh Huu Nguyen", email = "dinhuun@gmail.com"}]
classifiers = [
    "License: : OSI Approved :: MIT License",
    "Operating System :: OS Indpendent",
    "Programming Language :: Python :: 3",
]

dependencies = [
    "cookiecutter",
]

[dependency-groups]
dev = [
    "ruff",
    "pytest",
    "ty",
]

[project.urls]
Homepage = "https://github.com/dinhuun/ds_template.git"

[tool.ruff]
extend-exclude = ["*_pb2.py"]
line-length = 120
src = ["tests"]
target-version = "py313"

[tool.ruff.lint]
select = ["B", "E4", "E7", "E9", "F", "I"]
ignore = ["E741"]

[tool.ruff.lint.isort]
lines-after-imports = 2

[tool.ty.rules]
unresolved-import = "error"
